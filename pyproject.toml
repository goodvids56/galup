[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galup"
dynamic = ["version"]
description = "gallery-dl to Archive.org uploader (a fork of TubeUp)"
authors = [
    {name = "Bibliotheca Anonoma"},
    {name = "galup contributors"}
]
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "internetarchive",
    "docopt==0.6.2",
    "gallery-dl",
]
keywords = [
    "archive.org",
    "archiving",
    "bibliotheca anonoma",
    "internet archive",
    "gallery-dl",
    "gallery",
    "image",
    "video",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

[project.urls]
homepage = "https://github.com/goodvids56/galup"
source = "https://github.com/goodvids56/galup.git"
issues = "https://github.com/goodvids56/galup/issues"
upstream = "https://github.com/bibanon/tubeup"

[project.scripts]
galup = "galup.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "galup.__version__"}
